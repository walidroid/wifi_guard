appId: org.education.wifilabguardian
productName: WiFi Lab Guardian
copyright: Copyright © 2026 WiFi Lab Guardian

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - build/Release/wlan_native.node
  - package.json

asar: true
asarUnpack:
  - "build/Release/wlan_native.node"

extraResources:
  - from: "build/Release/wlan_native.node"
    to: "native/wlan_native.node"

win:
  target:
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: requireAdministrator
  signAndEditExecutable: true

portable:
  artifactName: "WiFiLabGuardian.exe"
  unpackDirName: "WiFiLabGuardian_Runtime"
