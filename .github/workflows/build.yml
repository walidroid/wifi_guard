name: Build WiFi Lab Guardian Portable Executable (Windows x64)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    name: Compile Standalone Portable Executable (csc.exe)
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Compile Portable C# Executable with csc.exe
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build-gui.ps1

      - name: 3. Verify Output Portable Executable
        shell: cmd
        run: |
          if not exist "WiFiLabGuardian.exe" (
            echo ERROR: Portable executable WiFiLabGuardian.exe was not produced!
            exit /b 1
          )
          dir "WiFiLabGuardian.exe"

      - name: 4. Upload Portable Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiLabGuardian-Portable-win-x64
          path: WiFiLabGuardian.exe
          if-no-files-found: error
          retention-days: 90

      - name: 5. Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WiFiLabGuardian.exe
            README.fr.md
            README.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
